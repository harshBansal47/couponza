[project]
name = "couponza"
version = "0.1.0"
description = "Coupon & deals platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "python-slugify>=8.0",
    "sqladmin>=0.32",
    "itsdangerous>=2.1",
    "slowapi>=0.1.10",
    "redis>=5.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]
mcp = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the intended DI pattern, not a bug.
# RUF012: sqladmin's ModelView reads plain list class attributes (column_list, etc.);
#         they're read-only framework config, never mutated, so ClassVar wouldn't help.
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# DTZ001: this test's whole point is exercising the naive-datetime code path.
"tests/test_admin.py" = ["DTZ001"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
